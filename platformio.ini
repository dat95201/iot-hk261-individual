; PlatformIO Project Configuration File
; IoT HK261 - Individual lab assignments - Board YoloUNO (ESP32-S3)
;
; Select which exercise to run by commenting / uncommenting the blocks
; inside setup() in src/main.cpp

[env:yolo_uno]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
; time       -> dong dau moi dong co timestamp, de thay nhip 1s/dong
; exception  -> giai ma backtrace neu board panic
monitor_filters = time, esp32_exception_decoder

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.15.1
    DHT20
    LCD
    PubSubClient

lib_compat_mode = strict
